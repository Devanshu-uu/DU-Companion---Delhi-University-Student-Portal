<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#100C19" />
      <stop offset="100%" stop-color="#181326" />
    </linearGradient>

    <linearGradient id="nodeAndroid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DDC84" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3DDC84" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="nodeSupa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ECF8E" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3ECF8E" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="nodeReact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#61DAFB" stop-opacity="0.05" />
    </linearGradient>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .at-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .at-sub   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; }
    .at-body  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; }
  </style>

  <!-- Background -->
  <rect width="1100" height="360" rx="16" fill="url(#archBg)" stroke="#CDA9F2" stroke-opacity="0.1" stroke-width="2" />

  <!-- Section Title -->
  <text x="550" y="44" text-anchor="middle" fill="#CDA9F2" font-size="12" class="at-sub" letter-spacing="1">UNIFIED ARCHITECTURE</text>
  <text x="550" y="74" text-anchor="middle" fill="#FFFFFF" font-size="24" class="at-title">How DU Companion Ecosystem Connects</text>

  <!-- Connecting Lines -->
  <g stroke="#7C3AED" stroke-width="2" stroke-dasharray="6,6" opacity="0.6">
    <!-- Android to Supabase -->
    <path d="M 330 200 L 440 200" />
    <!-- Supabase to Web Admin -->
    <path d="M 660 160 L 770 140" />
    <!-- Supabase to Legal Portal -->
    <path d="M 660 240 L 770 260" />
  </g>

  <!-- ==================== NODE 1: ANDROID CLIENT ==================== -->
  <g transform="translate(60, 120)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="270" height="160" rx="16" fill="#181324" stroke="#3DDC84" stroke-width="1.8" />
    <rect x="15" y="15" width="44" height="44" rx="10" fill="#0E2E1E" />
    <text x="27" y="43" font-size="20">📱</text>
    <text x="70" y="36" fill="#FFFFFF" font-size="16" class="at-title">Student App</text>
    <text x="70" y="52" fill="#3DDC84" font-size="11" class="at-sub">Android 8.0 - 15 (SDK 35)</text>

    <text x="18" y="85" fill="#CDA9F2" font-size="11" class="at-sub">• Kotlin 2.0 + Jetpack Compose</text>
    <text x="18" y="105" fill="#A8A2BC" font-size="11" class="at-body">• Offline Notes Cache &amp; PDF Reader</text>
    <text x="18" y="125" fill="#A8A2BC" font-size="11" class="at-body">• Material 3 DU Purple/Gold Design</text>
    <text x="18" y="145" fill="#A8A2BC" font-size="11" class="at-body">• AdMob Banner &amp; Interstitial Ads</text>
  </g>

  <!-- ==================== NODE 2: SUPABASE BACKEND ==================== -->
  <g transform="translate(440, 110)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="220" height="180" rx="16" fill="#161F24" stroke="#3ECF8E" stroke-width="2" />
    <rect x="15" y="15" width="44" height="44" rx="10" fill="#0C291D" />
    <text x="27" y="43" font-size="20">⚡</text>
    <text x="70" y="36" fill="#FFFFFF" font-size="16" class="at-title">Supabase</text>
    <text x="70" y="52" fill="#3ECF8E" font-size="11" class="at-sub">Database &amp; Storage</text>

    <text x="18" y="85" fill="#FDE68A" font-size="11" class="at-sub">• PostgreSQL Core DB</text>
    <text x="18" y="105" fill="#A8A2BC" font-size="11" class="at-body">• Secure PDF Storage Bucket</text>
    <text x="18" y="125" fill="#A8A2BC" font-size="11" class="at-body">• Row Level Security (RLS)</text>
    <text x="18" y="145" fill="#A8A2BC" font-size="11" class="at-body">• JWT Authentication Roles</text>
    <text x="18" y="165" fill="#A8A2BC" font-size="11" class="at-body">• OTA Release Metadata</text>
  </g>

  <!-- ==================== NODE 3A: ADMIN DASHBOARD ==================== -->
  <g transform="translate(770, 95)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="270" height="100" rx="14" fill="#181324" stroke="#61DAFB" stroke-width="1.5" />
    <rect x="12" y="12" width="34" height="34" rx="8" fill="#102533" />
    <text x="22" y="34" font-size="16">🛠️</text>
    <text x="56" y="28" fill="#FFFFFF" font-size="14" class="at-title">Admin Dashboard</text>
    <text x="56" y="42" fill="#61DAFB" font-size="10" class="at-sub">React 18 + Vite + Tailwind</text>
    <text x="14" y="68" fill="#A8A2BC" font-size="10" class="at-body">• Upload Notes, PYQ, and Syllabi</text>
    <text x="14" y="84" fill="#A8A2BC" font-size="10" class="at-body">• Restricted via app_metadata.role</text>
  </g>

  <!-- ==================== NODE 3B: LEGAL & PLAY STORE PORTAL ==================== -->
  <g transform="translate(770, 215)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="270" height="100" rx="14" fill="#181324" stroke="#F2C14E" stroke-width="1.5" />
    <rect x="12" y="12" width="34" height="34" rx="8" fill="#302306" />
    <text x="22" y="34" font-size="16">🌐</text>
    <text x="56" y="28" fill="#FFFFFF" font-size="14" class="at-title">Showcase &amp; Legal Portal</text>
    <text x="56" y="42" fill="#F2C14E" font-size="10" class="at-sub">Play Store Ready Website</text>
    <text x="14" y="68" fill="#A8A2BC" font-size="10" class="at-body">• Google Play Privacy Policy &amp; Terms</text>
    <text x="14" y="84" fill="#A8A2BC" font-size="10" class="at-body">• Mandatory User Data Deletion Form</text>
  </g>
</svg>
