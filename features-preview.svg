      <text x="0" y="16" fill="#FFFFFF" font-size="13" class="ft-title">Software Engineering Syllabus</text>
      <text x="280" y="16" text-anchor="end" fill="#60A5FA" font-size="13" class="ft-title">75%</text>
      <rect x="0" y="26" width="280" height="8" rx="4" fill="#1E293B" />
      <rect x="0" y="26" width="210" height="8" rx="4" fill="#3B82F6" />
    </g>

    <!-- Units list -->
    <g transform="translate(18, 140)">
      <rect x="0" y="0" width="284" height="48" rx="8" fill="#1E2438" />
      <circle cx="24" cy="24" r="10" fill="#10B981" />
      <text x="19" y="28" fill="#FFFFFF" font-size="12">✓</text>
      <text x="46" y="22" fill="#FFFFFF" font-size="12" class="ft-sub">Unit 1: Introduction &amp; SDLC</text>
      <text x="46" y="36" fill="#93C5FD" font-size="10" class="ft-body">Agile, Waterfall, Scrum Models</text>
    </g>

    <g transform="translate(18, 198)">
      <rect x="0" y="0" width="284" height="48" rx="8" fill="#1E2438" />
      <circle cx="24" cy="24" r="10" fill="#10B981" />
      <text x="19" y="28" fill="#FFFFFF" font-size="12">✓</text>
      <text x="46" y="22" fill="#FFFFFF" font-size="12" class="ft-sub">Unit 2: Software Requirements</text>
      <text x="46" y="36" fill="#93C5FD" font-size="10" class="ft-body">SRS Documentation, Use Cases</text>
    </g>

    <g transform="translate(18, 256)">
      <rect x="0" y="0" width="284" height="48" rx="8" fill="#1E2438" />
      <circle cx="24" cy="24" r="10" fill="#F59E0B" />
      <text x="21" y="28" fill="#FFFFFF" font-size="11">⏳</text>
      <text x="46" y="22" fill="#FFFFFF" font-size="12" class="ft-sub">Unit 3: Architecture &amp; Design</text>
      <text x="46" y="36" fill="#FDE68A" font-size="10" class="ft-body">In progress (3 lectures left)</text>
    </g>
