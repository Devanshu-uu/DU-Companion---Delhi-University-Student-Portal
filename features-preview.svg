<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="gridBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120E1C" />
      <stop offset="100%" stop-color="#1A1429" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5B2B8E" />
      <stop offset="100%" stop-color="#2D144A" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A6A1C" />
      <stop offset="100%" stop-color="#3A2A06" />
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .ft-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .ft-sub   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; }
    .ft-body  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="500" rx="16" fill="url(#gridBg)" stroke="#CDA9F2" stroke-opacity="0.1" stroke-width="2" />

  <!-- Section Header -->
  <g transform="translate(60, 48)">
    <text x="540" y="0" text-anchor="middle" fill="#CDA9F2" font-size="14" class="ft-sub" letter-spacing="1">STUDENT EXPERIENCE APPARATUS</text>
    <text x="540" y="32" text-anchor="middle" fill="#FFFFFF" font-size="32" class="ft-title">Tailored for Delhi University Curriculum</text>
  </g>

  <!-- ==================== SCREEN 1: STUDY NOTES & MATERIALS ==================== -->
  <g transform="translate(80, 115)" filter="url(#phoneShadow)">
    <rect x="0" y="0" width="320" height="340" rx="20" fill="#171322" stroke="#5B2B8E" stroke-width="2" />
    
    <!-- Header -->
    <rect x="15" y="15" width="290" height="60" rx="12" fill="url(#cardGrad1)" />
    <text x="32" y="42" fill="#FFFFFF" font-size="16" class="ft-title">📚 Study Notes &amp; PYQs</text>
    <text x="32" y="60" fill="#EDE4FA" font-size="11" class="ft-body">Verified Semester Materials</text>

    <!-- Filter chips -->
    <g transform="translate(20, 88)">
      <rect x="0" y="0" width="65" height="24" rx="6" fill="#5B2B8E" />
      <text x="32" y="16" text-anchor="middle" fill="#FFFFFF" font-size="10" class="ft-sub">Sem IV</text>

      <rect x="75" y="0" width="85" height="24" rx="6" fill="#251F33" stroke="#CDA9F2" stroke-width="0.6" stroke-opacity="0.3" />
      <text x="117" y="16" text-anchor="middle" fill="#CDA9F2" font-size="10" class="ft-sub">Computer Sci</text>

      <rect x="170" y="0" width="55" height="24" rx="6" fill="#251F33" stroke="#CDA9F2" stroke-width="0.6" stroke-opacity="0.3" />
      <text x="197" y="16" text-anchor="middle" fill="#A8A2BC" font-size="10" class="ft-sub">Core</text>
    </g>

    <!-- Item 1 -->
    <g transform="translate(18, 126)">
      <rect x="0" y="0" width="284" height="52" rx="10" fill="#211B30" />
      <rect x="10" y="10" width="32" height="32" rx="8" fill="#3B265E" />
      <text x="21" y="31" font-size="15">📄</text>
      <text x="52" y="24" fill="#FFFFFF" font-size="12" class="ft-title">Database Management Sys</text>
      <text x="52" y="38" fill="#9F98B4" font-size="10" class="ft-body">Complete Unit 1-4 Notes • PDF</text>
      <circle cx="262" cy="26" r="10" fill="#10B981" />
      <text x="257" y="30" fill="#FFFFFF" font-size="12">✓</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(18, 188)">
      <rect x="0" y="0" width="284" height="52" rx="10" fill="#211B30" />
      <rect x="10" y="10" width="32" height="32" rx="8" fill="#3B265E" />
      <text x="21" y="31" font-size="15">📑</text>
      <text x="52" y="24" fill="#FFFFFF" font-size="12" class="ft-title">Operating Systems 2023 PYQ</text>
      <text x="52" y="38" fill="#9F98B4" font-size="10" class="ft-body">Past University Examination</text>
      <rect x="235" y="17" width="38" height="18" rx="4" fill="#F2C14E" />
      <text x="254" y="29" text-anchor="middle" fill="#2C1E00" font-size="9" class="ft-title">PYQ</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(18, 250)">
      <rect x="0" y="0" width="284" height="52" rx="10" fill="#211B30" />
      <rect x="10" y="10" width="32" height="32" rx="8" fill="#3B265E" />
      <text x="21" y="31" font-size="15">📘</text>
      <text x="52" y="24" fill="#FFFFFF" font-size="12" class="ft-title">Algorithms &amp; Complexity</text>
      <text x="52" y="38" fill="#9F98B4" font-size="10" class="ft-body">Handwritten Topper Notes</text>
    </g>
