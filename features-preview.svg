    <text x="32" y="42" fill="#FFFFFF" font-size="16" class="ft-title">🎯 Syllabus Tracker</text>
    <text x="32" y="60" fill="#93C5FD" font-size="11" class="ft-body">Unit-wise Course Milestones</text>

    <!-- Progress summary -->
