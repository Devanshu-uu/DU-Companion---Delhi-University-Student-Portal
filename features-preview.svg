    <text x="32" y="42" fill="#FFFFFF" font-size="16" class="ft-title">🧮 DU SGPA Calculator</text>
    <text x="32" y="60" fill="#FDE68A" font-size="11" class="ft-body">UGCF &amp; CBCS 10-Point Relative</text>

    <!-- Big Score Display -->
