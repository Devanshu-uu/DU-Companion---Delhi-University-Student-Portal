      <rect x="0" y="0" width="284" height="80" rx="12" fill="#271F11" stroke="#F2C14E" stroke-width="1" stroke-opacity="0.3" />
      <text x="20" y="32" fill="#FDE68A" font-size="11" class="ft-sub">PROJECTED RESULT</text>
      <text x="20" y="64" fill="#FFFFFF" font-size="34" class="ft-title">9.14</text>
      <text x="105" y="60" fill="#F2C14E" font-size="14" class="ft-title">SGPA / 10</text>
      
      <rect x="195" y="25" width="75" height="26" rx="6" fill="#10B981" />
      <text x="232" y="42" text-anchor="middle" fill="#FFFFFF" font-size="11" class="ft-title">O Grade</text>
    </g>

    <!-- Subject calculation rows -->
