      <rect x="0" y="0" width="284" height="40" rx="8" fill="#221C2E" />
      <text x="14" y="25" fill="#FFFFFF" font-size="12" class="ft-sub">Core Paper I (Credits: 4)</text>
      <rect x="230" y="8" width="42" height="24" rx="4" fill="#3B265E" />
      <text x="251" y="24" text-anchor="middle" fill="#CDA9F2" font-size="12" class="ft-title">10 (O)</text>
    </g>

    <g transform="translate(18, 228)">
      <rect x="0" y="0" width="284" height="40" rx="8" fill="#221C2E" />
      <text x="14" y="25" fill="#FFFFFF" font-size="12" class="ft-sub">Core Paper II (Credits: 4)</text>
      <rect x="230" y="8" width="42" height="24" rx="4" fill="#3B265E" />
      <text x="251" y="24" text-anchor="middle" fill="#CDA9F2" font-size="12" class="ft-title">9 (A+)</text>
    </g>

    <g transform="translate(18, 276)">
      <rect x="0" y="0" width="284" height="40" rx="8" fill="#221C2E" />
      <text x="14" y="25" fill="#FFFFFF" font-size="12" class="ft-sub">Generic Elective (Credits: 4)</text>
      <rect x="230" y="8" width="42" height="24" rx="4" fill="#3B265E" />
      <text x="251" y="24" text-anchor="middle" fill="#CDA9F2" font-size="12" class="ft-title">9 (A+)</text>
    </g>
